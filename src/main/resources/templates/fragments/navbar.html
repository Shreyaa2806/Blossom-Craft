
<header class="main-header" th:fragment="navbar">

    <!-- BRAND - ORIGINAL LOGO SECTION -->
    <a th:href="@{${session.adminLoggedIn == true ? '/admin/dashboard' : '/'}}"
       class="brand">

        <img th:src="@{/image/blossomcraft.png}"
             alt="Blossom Craft Logo"
             class="brand-logo">

        <span class="brand-tagline">HANDMADE WITH LOVE</span>

    </a>

    <!-- ADMIN NAVBAR -->
    <nav class="main-nav" th:if="${session.adminLoggedIn == true}">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/orders}">Manage Orders</a>
        <a th:href="@{/manage-products}">Manage Products</a>
        <a th:href="@{/add-product}">Add Product</a>
        <a th:href="@{/admin/logout}">Logout</a>
    </nav>

    <!-- CUSTOMER NAVBAR -->
    <nav class="main-nav" th:unless="${session.adminLoggedIn == true}">
        <a th:href="@{/}">Home</a>
        <a th:href="@{/shop}">Shop</a>
        <a th:href="@{/orders}">My Orders</a>
        <a th:href="@{/#about}">About</a>
        <a th:href="@{/#contact}">Contact</a>
    </nav>

    <!-- CUSTOMER ICONS -->
    <div class="header-icons"
         th:unless="${session.adminLoggedIn == true}">

        <a th:href="@{/wishlist}" title="Wishlist">♡</a>
        <a th:href="@{/cart}" title="Shopping Cart">🛒</a>

        <!-- ADMIN LOGIN ICON -->
        <a th:href="@{/admin/login}"
           title="Admin Login"
           class="admin-login-icon">
            🔑
        </a>

        <!-- BEFORE CUSTOMER LOGIN: PINK OUTLINE ACCOUNT ICON -->
        <a th:if="${session.loggedInUserName == null}"
           th:href="@{/login}"
           title="My Account"
           class="profile-icon">

            <svg viewBox="0 0 48 48"
                 class="profile-symbol"
                 aria-hidden="true">
                <circle cx="24" cy="16" r="8"/>
                <path d="M9 40c0-8 6-13 15-13s15 5 15 13"/>
            </svg>

        </a>

        <!-- AFTER CUSTOMER LOGIN -->
        <div class="account-menu"
             th:if="${session.loggedInUserName != null}">

            <button type="button"
                    class="account-button"
                    onclick="this.nextElementSibling.classList.toggle('show')">

                <span th:text="${session.loggedInUserName}">Customer</span>
                <span>⌄</span>
            </button>

            <div class="account-dropdown">

                <div class="account-dropdown-name">
                    <strong th:text="${session.loggedInUserName}">
                        Customer
                    </strong>
                    <small>My Account</small>
                </div>

                <div class="dropdown-divider"></div>

                <a th:href="@{/logout}" class="logout-link">
                    Logout
                </a>

            </div>
        </div>
    </div>

    <style>

        /* CONSISTENT NAVBAR FONT */
        .main-header .main-nav a {
            font-family: 'Poppins', Arial, sans-serif;
            font-size: 15px;
            font-weight: 500;
            color: #55434a;
            text-decoration: none;
            white-space: nowrap;
            transition: 0.3s;
        }

        .main-header .main-nav a:hover {
            color: #bd7188;
        }

        /* ADMIN LOGIN ICON */
        .admin-login-icon {
            font-size: 21px !important;
            text-decoration: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .admin-login-icon:hover {
            transform: scale(1.1);
        }

        /* ACCOUNT ICON */
        .profile-icon {
            color: #bd7188;
            text-decoration: none;
            display: flex;
            align-items: center;
        }

        .profile-symbol {
            width: 25px;
            height: 25px;
            fill: none;
            stroke: #bd7188;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            display: block;
            transition: 0.3s;
        }

        .profile-icon:hover .profile-symbol {
            stroke: #9b536d;
            transform: scale(1.1);
        }

        /* ACCOUNT DROPDOWN */
        .account-menu {
            position: relative;
        }

        .account-button {
            background: transparent;
            border: none;
            color: #593c46;
            cursor: pointer;
            font-family: 'Poppins', Arial, sans-serif;
            font-size: 15px;
        }

        .account-dropdown {
            display: none;
            position: absolute;
            right: 0;
            top: 35px;
            width: 190px;
            background: white;
            border: 1px solid #f1dfe4;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(89,60,70,0.13);
            z-index: 9999;
            padding: 15px;
        }

        .account-dropdown.show {
            display: block;
        }

        .account-dropdown-name strong,
        .account-dropdown-name small {
            display: block;
        }

        .account-dropdown-name small {
            margin-top: 5px;
            color: #999;
        }

        .dropdown-divider {
            height: 1px;
            background: #f1dfe4;
            margin: 12px 0;
        }

        .logout-link {
            color: #bd7188;
            text-decoration: none;
        }

        /* ORIGINAL BRAND STYLING */
        .main-header .brand {
            display: flex !important;
            flex-direction: row !important;
            align-items: center !important;
            justify-content: flex-start;
            gap: 20px;
            width: auto;
            text-decoration: none;
        }

        .main-header .brand-logo {
            width: 240px;
            height: 140px;
            object-fit: contain;
            display: block;
            flex-shrink: 0;
        }

        .main-header .brand-tagline {
            display: block;
            color: #bd7188;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: 3px;
            white-space: nowrap;
            margin: 0;
        }

        /* TABLET */
        @media (max-width: 1200px) {
            .main-header .brand-logo {
                width: 190px;
                height: 110px;
            }

            .main-header .brand-tagline {
                font-size: 13px;
                letter-spacing: 2px;
            }
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .main-header .brand {
                gap: 8px;
            }

            .main-header .brand-logo {
                width: 130px;
                height: 85px;
            }

            .main-header .brand-tagline {
                font-size: 10px;
                letter-spacing: 1px;
            }
        }

    </style>

</header>
